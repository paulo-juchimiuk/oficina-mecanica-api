name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java do projeto
        uses: actions/setup-java@v6.0.1
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Build da aplicação
        run: mvn -B -DskipTests package

      - name: Testes automatizados
        run: mvn -B verify

      - name: Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Conferência do Terraform
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra fmt -check
          terraform -chdir=infra validate

  imagem:
    name: Build da imagem Docker
    needs: build-e-testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login no GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação da imagem
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no cluster Kubernetes
    needs: imagem
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, oficina-local]
    permissions:
      contents: read
      packages: read
    env:
      CLUSTER: oficina
      NAMESPACE: oficina
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Conferência do cluster
        run: |
          kind get kubeconfig --name "$CLUSTER" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get nodes
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl -n "$NAMESPACE" get deployment banco

      - name: Login no GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Carga da imagem no cluster
        run: |
          docker pull "$IMAGEM:$GITHUB_SHA"
          docker tag "$IMAGEM:$GITHUB_SHA" "$IMAGEM:main"
          kind load docker-image "$IMAGEM:$GITHUB_SHA" "$IMAGEM:main" --name "$CLUSTER"

      - name: Aplicação dos manifestos
        run: |
          cp -r k8s "$RUNNER_TEMP/k8s"
          sed -i "s|$IMAGEM:main|$IMAGEM:$GITHUB_SHA|" "$RUNNER_TEMP/k8s/oficina-app-deployment.yaml"
          kubectl -n "$NAMESPACE" delete job seed --ignore-not-found
          kubectl -n "$NAMESPACE" create configmap seed --from-file=seed/ --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f "$RUNNER_TEMP/k8s/"
          PUBLICADA=$(kubectl -n "$NAMESPACE" get deployment oficina-app -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Imagem publicada: $PUBLICADA"
          [ "$PUBLICADA" = "$IMAGEM:$GITHUB_SHA" ]
          kubectl -n "$NAMESPACE" rollout status deployment/oficina-app --timeout=300s

      - name: Deploy do banco de dados
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/banco --timeout=120s
          kubectl -n "$NAMESPACE" logs deployment/oficina-app | grep -E 'Successfully applied|is up to date'
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/seed --timeout=300s
          kubectl -n "$NAMESPACE" logs job/seed

      - name: Conferência da aplicação
        run: curl -fsS --max-time 10 http://localhost:8080/actuator/health/readiness
