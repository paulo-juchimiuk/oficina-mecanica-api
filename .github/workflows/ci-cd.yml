name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java do projeto
        uses: actions/setup-java@v6.0.1
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Build da aplicação
        run: mvn -B -DskipTests package

      - name: Testes automatizados
        run: mvn -B verify

      - name: Cobertura dos testes
        run: |
          COBERTURA=$(awk -F, '
            NR == 1 { for (i = 1; i <= NF; i++) coluna[$i] = i; next }
            {
              linhas_perdidas += $coluna["LINE_MISSED"]
              linhas_cobertas += $coluna["LINE_COVERED"]
              instrucoes_perdidas += $coluna["INSTRUCTION_MISSED"]
              instrucoes_cobertas += $coluna["INSTRUCTION_COVERED"]
            }
            END {
              printf "linhas %.2f%%, instruções %.2f%%",
                100 * linhas_cobertas / (linhas_perdidas + linhas_cobertas),
                100 * instrucoes_cobertas / (instrucoes_perdidas + instrucoes_cobertas)
            }' target/site/jacoco/jacoco.csv)
          echo "Cobertura dos testes: $COBERTURA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Conferência do Terraform
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra fmt -check
          terraform -chdir=infra validate

  imagem:
    name: Build da imagem Docker
    needs: build-e-testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login no GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação da imagem
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no cluster Kubernetes
    needs: imagem
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    env:
      CLUSTER: oficina
      NAMESPACE: oficina
      REGIAO: us-east-1
      KUBECTL_VERSAO: v1.35.9
      KUBECTL_SHA256: 3cfeaf80be482b435b0aa214aff6e0b2c312ee23c0ff20810c75517b6004c6eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Credencial da AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGIAO }}

      - name: kubectl na versão do cluster
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSAO/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Conferência do cluster
        id: cluster
        run: |
          set +e
          STATUS=$(aws eks describe-cluster --name "$CLUSTER" --region "$REGIAO" --query cluster.status --output text 2> "$RUNNER_TEMP/erro")
          CODIGO=$?
          set -e
          if [ "$CODIGO" -ne 0 ] && grep -q ResourceNotFoundException "$RUNNER_TEMP/erro"; then
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Cluster $CLUSTER não encontrado: publicação pulada" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CODIGO" -ne 0 ]; then
            cat "$RUNNER_TEMP/erro"
            exit 1
          fi
          if [ "$STATUS" != ACTIVE ]; then
            echo "Cluster $CLUSTER em $STATUS: publicação recusada" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region "$REGIAO" --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get nodes
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl -n "$NAMESPACE" get deployment banco
          echo "existe=true" >> "$GITHUB_OUTPUT"

      - name: Aplicação dos manifestos
        if: steps.cluster.outputs.existe == 'true'
        run: |
          cp -r k8s "$RUNNER_TEMP/k8s"
          sed -i "s|$IMAGEM:main|$IMAGEM:$GITHUB_SHA|" "$RUNNER_TEMP/k8s/oficina-app-deployment.yaml"
          grep -F "image: $IMAGEM:$GITHUB_SHA" "$RUNNER_TEMP/k8s/oficina-app-deployment.yaml"
          kubectl -n "$NAMESPACE" delete job seed --ignore-not-found
          kubectl -n "$NAMESPACE" create configmap seed --from-file=seed/ --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f "$RUNNER_TEMP/k8s/"
          kubectl -n "$NAMESPACE" rollout status deployment/oficina-app --timeout=300s

      - name: Deploy do banco de dados
        if: steps.cluster.outputs.existe == 'true'
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/banco --timeout=120s
          kubectl -n "$NAMESPACE" logs deployment/oficina-app | grep -E 'Successfully applied|is up to date'
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/seed --timeout=300s
          kubectl -n "$NAMESPACE" logs job/seed

      - name: Conferência da aplicação
        if: steps.cluster.outputs.existe == 'true'
        run: |
          kubectl -n "$NAMESPACE" port-forward service/oficina-app 8080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          ENCAMINHAMENTO=$!
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 --max-time 10 http://localhost:8080/actuator/health/readiness
          kill "$ENCAMINHAMENTO"
