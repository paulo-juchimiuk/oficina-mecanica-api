<svg xmlns="http://www.w3.org/2000/svg" width="830" height="780" viewBox="0 0 830 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#707070"/>
    </marker>
  </defs>
  <rect width="830" height="780" fill="#ffffff"/>

  <circle cx="215" cy="42" r="26" fill="#6b1010"/>
  <rect x="110" y="60" width="210" height="106" rx="22" fill="#6b1010"/>
  <text x="215" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Atendente, mecânico</text>
  <text x="215" y="104" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">e estoquista</text>
  <text x="215" y="120" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Pessoa]</text>
  <text x="215" y="138" text-anchor="middle" font-size="10.5" fill="#ffffff">operam a oficina pelas</text>
  <text x="215" y="152" text-anchor="middle" font-size="10.5" fill="#ffffff">APIs administrativas</text>

  <circle cx="615" cy="42" r="26" fill="#6b1010"/>
  <rect x="510" y="60" width="210" height="106" rx="22" fill="#6b1010"/>
  <text x="615" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Cliente</text>
  <text x="615" y="112" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Pessoa]</text>
  <text x="615" y="132" text-anchor="middle" font-size="10.5" fill="#ffffff">acompanha a OS e responde</text>
  <text x="615" y="146" text-anchor="middle" font-size="10.5" fill="#ffffff">ao orçamento</text>

  <rect x="15" y="215" width="800" height="335" fill="none" stroke="#d98a8a" stroke-width="1.3" stroke-dasharray="9 6"/>
  <text x="27" y="530" font-size="13" fill="#8c1c1c">API REST</text>
  <text x="27" y="543" font-size="9.5" fill="#8c1c1c">[Contêiner: Java 25 e Spring Boot 4.1]</text>

  <rect x="310" y="235" width="210" height="105" fill="#a52a2a"/>
  <text x="415" y="263" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Controllers e Presenters</text>
  <text x="415" y="279" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Componente: pacote api, Spring MVC]</text>
  <text x="415" y="298" text-anchor="middle" font-size="10.5" fill="#ffffff">recebem as chamadas REST e</text>
  <text x="415" y="312" text-anchor="middle" font-size="10.5" fill="#ffffff">traduzem o agregado na resposta</text>

  <rect x="30" y="395" width="210" height="105" fill="#a52a2a"/>
  <text x="135" y="423" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Casos de uso</text>
  <text x="135" y="439" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Componente: pacote application]</text>
  <text x="135" y="458" text-anchor="middle" font-size="10.5" fill="#ffffff">orquestram cada operação, sem</text>
  <text x="135" y="472" text-anchor="middle" font-size="10.5" fill="#ffffff">nenhum import de framework</text>

  <rect x="310" y="395" width="210" height="105" fill="#a52a2a"/>
  <text x="415" y="423" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Entidades e portas</text>
  <text x="415" y="439" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Componente: pacote domain]</text>
  <text x="415" y="458" text-anchor="middle" font-size="10.5" fill="#ffffff">agregados, regras de negócio</text>
  <text x="415" y="472" text-anchor="middle" font-size="10.5" fill="#ffffff">e portas de saída</text>

  <rect x="590" y="395" width="210" height="105" fill="#a52a2a"/>
  <text x="695" y="423" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Gateways e configuração</text>
  <text x="695" y="439" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Componente: pacote infrastructure]</text>
  <text x="695" y="456" text-anchor="middle" font-size="10.5" fill="#ffffff">implementam as portas, registram</text>
  <text x="695" y="470" text-anchor="middle" font-size="10.5" fill="#ffffff">os casos de uso como bean e</text>
  <text x="695" y="484" text-anchor="middle" font-size="10.5" fill="#ffffff">declaram a transação</text>

  <rect x="310" y="600" width="210" height="105" fill="#5a5a5a"/>
  <text x="415" y="628" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Serviço de e-mail</text>
  <text x="415" y="644" text-anchor="middle" font-size="9.5" fill="#ffffff">[Sistema de software: Mailpit]</text>
  <text x="415" y="663" text-anchor="middle" font-size="10.5" fill="#ffffff">entrega o orçamento e o aviso</text>
  <text x="415" y="677" text-anchor="middle" font-size="10.5" fill="#ffffff">de cada mudança de status</text>

  <path d="M590,600 L590,705 A105,13 0 0,0 800,705 L800,600 Z" fill="#8c1c1c"/>
  <ellipse cx="695" cy="600" rx="105" ry="13" fill="#9c2424" stroke="#6b1010" stroke-width="1"/>
  <text x="695" y="642" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Banco de dados</text>
  <text x="695" y="658" text-anchor="middle" font-size="9.5" fill="#fff0f0">[Contêiner: PostgreSQL 18]</text>
  <text x="695" y="677" text-anchor="middle" font-size="10.5" fill="#ffffff">cadastros, estoque, ordens de</text>
  <text x="695" y="691" text-anchor="middle" font-size="10.5" fill="#ffffff">serviço e transições de status</text>

  <path d="M240,166 L345,233" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M590,166 L485,233" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M330,340 L200,393" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M415,340 L415,393" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M240,447 L308,447" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M590,447 L522,447" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M720,500 L720,585" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M670,500 L492,598" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>
  <path d="M600,500 L600,522 L135,522 L135,502" fill="none" stroke="#707070" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#ponta)"/>

  <text x="236" y="196" text-anchor="end" font-size="10.5" fill="#222222">usam</text>
  <text x="236" y="208" text-anchor="end" font-size="9.5" fill="#333333">[JSON/HTTP, JWT]</text>

  <text x="562" y="196" font-size="10.5" fill="#222222">consulta e responde</text>
  <text x="562" y="208" font-size="9.5" fill="#333333">[JSON/HTTP, código de acompanhamento]</text>

  <text x="252" y="362" text-anchor="end" font-size="10.5" fill="#222222">chamam</text>

  <text x="425" y="371" font-size="10.5" fill="#222222">leem o agregado</text>

  <text x="274" y="440" text-anchor="middle" font-size="10.5" fill="#222222">usam</text>

  <text x="556" y="440" text-anchor="middle" font-size="10.5" fill="#222222">implementam</text>

  <text x="730" y="566" font-size="10.5" fill="#222222">lê e grava</text>
  <text x="730" y="578" font-size="9.5" fill="#333333">[JDBC]</text>

  <text x="368" y="536" text-anchor="middle" font-size="10.5" fill="#222222">registram os casos de uso e implementam as portas</text>

  <text x="585" y="566" font-size="10.5" fill="#222222">envia e-mail</text>
  <text x="585" y="578" font-size="9.5" fill="#333333">[SMTP]</text>

  <text x="15" y="745" font-size="15" font-weight="bold" fill="#222222">[Componente] oficina-mecanica-api: API REST</text>
  <text x="15" y="764" font-size="10.5" fill="#555555">Os quatro pacotes se repetem em cada contexto delimitado, e as dependências de código apontam para o domínio (ADR-025).</text>
</svg>
