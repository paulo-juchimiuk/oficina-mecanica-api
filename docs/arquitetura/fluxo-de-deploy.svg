<svg xmlns="http://www.w3.org/2000/svg" width="830" height="695" viewBox="0 0 830 695" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="830" height="695" fill="#ffffff"/>

  <circle cx="52" cy="107" r="15" fill="none" stroke="#222222" stroke-width="2"/>
