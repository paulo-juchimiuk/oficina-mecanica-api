  <text x="15" y="730" font-size="15" font-weight="bold" fill="#222222">[Fluxo de deploy] Pipeline de CI/CD</text>
  <text x="15" y="748" font-size="10.5" fill="#555555">Tudo roda no GitHub e entra na AWS por OIDC: o deploy publica a cada push na main ou pelo botão, e o cluster nasce e é destruído pelo botão (ADR-029).</text>
