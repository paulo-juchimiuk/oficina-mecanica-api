  <text x="526" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">CI/CD</text>
  <text x="526" y="80" text-anchor="middle" font-size="9.5" fill="#444444">ci-cd.yml, runner hospedado pelo GitHub</text>

  <rect x="415" y="92" width="222" height="58" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="526" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">1. Build e testes</text>
  <text x="526" y="129" text-anchor="middle" font-size="9.5" fill="#444444">mvn verify com Testcontainers</text>
  <text x="526" y="143" text-anchor="middle" font-size="9.5" fill="#444444">terraform fmt e validate</text>

  <rect x="415" y="172" width="222" height="50" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="526" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">2. Build da imagem Docker</text>
  <text x="526" y="209" text-anchor="middle" font-size="9.5" fill="#444444">tags do SHA do commit e main</text>

  <rect x="415" y="244" width="222" height="244" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="526" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">3. Deploy no cluster Kubernetes</text>
  <text x="526" y="277" text-anchor="middle" font-size="9.5" fill="#444444">pula a publicação sem cluster</text>

