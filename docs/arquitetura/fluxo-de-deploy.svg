  <path d="M560,275 L560,302" fill="none" stroke="#333333" stroke-width="1.4"/>
  <path d="M560,318 L560,353" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ponta)"/>
  <path d="M505,496 L397,496" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ponta)"/>
  <path d="M292,572 L292,549" fill="none" stroke="#333333" stroke-width="1.4"/>
  <path d="M292,533 L292,512" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ponta)"/>
  <path d="M608,220 L693,220" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ponta)"/>
  <path d="M752,250 L752,302" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M752,318 L752,353" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ponta)"/>

  <rect x="217" y="533" width="150" height="16" rx="3" fill="#1f1f1f"/>
  <text x="292" y="545" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">provisiona o cluster e o banco</text>

  <rect x="103" y="118" width="75" height="16" rx="3" fill="#1f1f1f"/>
  <text x="140" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">push na main</text>

  <rect x="305" y="118" width="100" height="16" rx="3" fill="#1f1f1f"/>
  <text x="355" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">dispara o workflow</text>

  <rect x="636" y="212" width="48" height="16" rx="3" fill="#1f1f1f"/>
  <text x="660" y="224" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">publica</text>

  <rect x="501" y="302" width="118" height="16" rx="3" fill="#1f1f1f"/>
  <text x="560" y="314" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">job 3 espera o runner</text>

  <rect x="719" y="302" width="66" height="16" rx="3" fill="#1f1f1f"/>
  <text x="752" y="314" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">docker pull</text>

  <rect x="415" y="488" width="72" height="16" rx="3" fill="#1f1f1f"/>
  <text x="451" y="500" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">kubectl apply</text>

  <text x="15" y="660" font-size="15" font-weight="bold" fill="#222222">[Fluxo de deploy] Pipeline de CI/CD</text>
  <text x="15" y="678" font-size="10.5" fill="#555555">Os dois primeiros jobs rodam no GitHub; o deploy roda na máquina onde o cluster está e espera na fila com o runner desligado (ADR-027).</text>
