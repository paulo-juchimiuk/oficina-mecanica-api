  <text x="526" y="644" text-anchor="middle" font-size="9.5" fill="#444444">API, banco, caixa de e-mail e</text>
  <text x="526" y="657" text-anchor="middle" font-size="9.5" fill="#444444">carga no namespace oficina</text>

