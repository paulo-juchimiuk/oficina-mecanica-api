  <text x="52" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">Pessoa</text>
  <text x="52" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">desenvolvedora</text>
  <text x="52" y="213" text-anchor="middle" font-size="9.5" fill="#444444">também pelo botão</text>
  <text x="52" y="225" text-anchor="middle" font-size="9.5" fill="#444444">Run workflow</text>

  <rect x="150" y="20" width="665" height="275" rx="6" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="162" y="40" font-size="13" font-weight="bold" fill="#222222">GitHub</text>

  <rect x="190" y="92" width="105" height="68" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="242.5" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">Repositório</text>
  <text x="242.5" y="136" text-anchor="middle" font-size="9.5" fill="#444444">oficina-mecanica-api</text>
  <text x="242.5" y="181" text-anchor="middle" font-size="9.5" fill="#444444">pull request roda</text>
  <text x="242.5" y="193" text-anchor="middle" font-size="9.5" fill="#444444">só o job 1</text>

  <rect x="416" y="45" width="208" height="230" rx="6" fill="#f6f6f6" stroke="#777777" stroke-width="1"/>
  <text x="520" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">GitHub Actions</text>
  <text x="520" y="80" text-anchor="middle" font-size="9.5" fill="#444444">runner hospedado pelo GitHub</text>

  <rect x="432" y="92" width="176" height="68" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="520" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">1. Build e testes</text>
  <text x="520" y="129" text-anchor="middle" font-size="9.5" fill="#444444">mvn verify com Testcontainers</text>
  <text x="520" y="143" text-anchor="middle" font-size="9.5" fill="#444444">terraform fmt e validate</text>

  <rect x="432" y="190" width="176" height="60" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="520" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">2. Build da imagem Docker</text>
  <text x="520" y="228" text-anchor="middle" font-size="9.5" fill="#444444">tags do SHA do commit e main</text>

  <rect x="695" y="190" width="115" height="60" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="752" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">GitHub</text>
  <text x="752" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222222">Container Registry</text>
  <text x="752" y="240" text-anchor="middle" font-size="9.5" fill="#444444">imagem pública</text>

  <rect x="150" y="325" width="665" height="300" rx="6" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="162" y="345" font-size="13" font-weight="bold" fill="#222222">Máquina local</text>

  <rect x="480" y="355" width="330" height="255" rx="6" fill="#f6f6f6" stroke="#777777" stroke-width="1"/>
  <text x="645" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">3. Deploy no cluster Kubernetes</text>
  <text x="645" y="390" text-anchor="middle" font-size="9.5" fill="#444444">runner auto-hospedado, rótulo oficina-local</text>

  <rect x="505" y="398" width="280" height="28" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="645" y="416" text-anchor="middle" font-size="11" fill="#222222">Conferência do cluster</text>
  <rect x="505" y="440" width="280" height="28" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="645" y="458" text-anchor="middle" font-size="11" fill="#222222">Carga da imagem no cluster</text>
  <rect x="505" y="482" width="280" height="28" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="645" y="500" text-anchor="middle" font-size="11" fill="#222222">Aplicação dos manifestos</text>
  <rect x="505" y="524" width="280" height="28" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="645" y="542" text-anchor="middle" font-size="11" fill="#222222">Deploy do banco de dados</text>
  <rect x="505" y="566" width="280" height="28" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="645" y="584" text-anchor="middle" font-size="11" fill="#222222">Conferência da aplicação</text>

  <rect x="190" y="430" width="205" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="292" y="455" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">Cluster kind oficina</text>
  <text x="292" y="472" text-anchor="middle" font-size="9.5" fill="#444444">API, banco, caixa de e-mail e</text>
  <text x="292" y="485" text-anchor="middle" font-size="9.5" fill="#444444">carga no namespace oficina</text>

  <rect x="190" y="572" width="205" height="45" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <text x="292" y="591" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222222">terraform apply</text>
  <text x="292" y="607" text-anchor="middle" font-size="9.5" fill="#444444">no terminal, antes da pipeline</text>

