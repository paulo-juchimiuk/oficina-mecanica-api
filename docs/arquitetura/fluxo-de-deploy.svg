  <text x="227.5" y="338" text-anchor="middle" font-size="9.5" fill="#444444">infra.yml, pelo botão</text>
  <text x="227.5" y="352" text-anchor="middle" font-size="9.5" fill="#444444">terraform plan e apply</text>
  <text x="227.5" y="366" text-anchor="middle" font-size="9.5" fill="#444444">apply ou destroy</text>

