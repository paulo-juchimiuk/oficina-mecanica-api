services:
  banco:
    image: postgres:18-alpine
    container_name: oficina-banco
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina_local
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A imagem guarda os dados em subdiretorio por versao maior, entao o
      # volume monta um nivel acima desse subdiretorio.
      - dados_banco:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oficina -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  email:
    image: axllent/mailpit:v1.21
    container_name: oficina-email
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    depends_on:
      banco:
        condition: service_healthy
      email:
        condition: service_started
    environment:
      SPRING_MAIL_HOST: email
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/oficina
      SPRING_DATASOURCE_USERNAME: oficina
      SPRING_DATASOURCE_PASSWORD: oficina_local
      JWT_SEGREDO: trocar-este-segredo-local-de-32-bytes-ou-mais
      TZ: UTC
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      SERVER_TOMCAT_ACCESSLOG_DIRECTORY: /dev
      SERVER_TOMCAT_ACCESSLOG_PREFIX: stdout
      SERVER_TOMCAT_ACCESSLOG_SUFFIX: ""
      SERVER_TOMCAT_ACCESSLOG_ROTATE: "false"
      SERVER_TOMCAT_ACCESSLOG_BUFFERED: "false"
      SERVER_TOMCAT_ACCESSLOG_PATTERN: "%t %m %U %s %F ms"
    ports:
      - "127.0.0.1:8080:8080"

  seed:
    image: postgres:18-alpine
    container_name: oficina-seed
    depends_on:
      banco:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      PGHOST: banco
      PGUSER: oficina
      PGDATABASE: oficina
      PGPASSWORD: oficina_local
      TZ: UTC
    volumes:
      - ./seed:/seed:ro
    command: ["sh", "/seed/carrega.sh"]

volumes:
  dados_banco:
