spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Namespace proprio: chave simetrica nao e propriedade do resource server do
# Spring, que so aceita issuer-uri, jwk-set-uri e public-key-location. Posta ali,
# seria ignorada em silencio. O default tem 32 bytes ou mais porque o HS256 exige
# no minimo 256 bits (RFC 7518).
oficina:
  jwt:
    segredo: ${JWT_SEGREDO:trocar-este-segredo-local-de-32-bytes-ou-mais}

logging:
  level:
    root: INFO
    br.com.oficinamecanica: DEBUG
