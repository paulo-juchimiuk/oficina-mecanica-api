spring:
  application:
    name: oficina-mecanica-api

  servlet:
    multipart:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    version: 5.32.13
  api-docs:
    path: /v3/api-docs

oficina:
  acompanhamento:
    url-base: ${OFICINA_ACOMPANHAMENTO_URL_BASE:http://localhost:8080/api/v1/acompanhamento}

  email:
    remetente: ${OFICINA_EMAIL_REMETENTE:oficina@oficina.local}

  jwt:
    segredo: ${JWT_SEGREDO:trocar-este-segredo-local-de-32-bytes-ou-mais}
    validade-em-minutos: ${JWT_VALIDADE_EM_MINUTOS:60}

logging:
  level:
    root: INFO
    br.com.oficinamecanica: DEBUG
