spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

oficina:
  jwt:
    segredo: ${JWT_SEGREDO:trocar-este-segredo-local-de-32-bytes-ou-mais}
    validade-em-minutos: ${JWT_VALIDADE_EM_MINUTOS:60}

logging:
  level:
    root: INFO
    br.com.oficinamecanica: DEBUG
